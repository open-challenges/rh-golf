name: test

# The line counter's unit tests, the leaderboard check, and the judge's tests on toy entries
# (harness/tests: a stand-in Statements.lean, so no Mathlib is needed; includes entries that slip an
# ill-typed theorem past Lean's elaborator, which the kernel replay must reject).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python3 -m unittest discover -s scripts -v
      - run: python3 scripts/leaderboard.py --check
      - run: python3 scripts/count_lines.py --help > /dev/null

  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and the harness's toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          "$HOME/.elan/bin/elan" toolchain install "$(cat harness/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Judge tests
        working-directory: harness
        run: python3 tests/run_judge_tests.py --lean "$(elan which lean)"
